---
- name: Reset the managed CrowdSec credential identity for this invocation
  ansible.builtin.set_fact:
    _perimeterd_crowdsec_credential_sha256: ''

- name: Provision the optional CrowdSec bouncer credential
  when:
    - perimeterd_crowdsec_api_key is defined
    - perimeterd_config.crowdsec.enabled | default(false)
  block:
    - name: Require an absolute managed CrowdSec credential path
      ansible.builtin.assert:
        that:
          - perimeterd_config.crowdsec.api_key_file is abs
        fail_msg: >-
          crowdsec.api_key_file must be an absolute path when
          perimeterd_crowdsec_api_key is defined and CrowdSec is enabled.

    - name: Ensure the CrowdSec credential directory is private
      ansible.builtin.file:
        path: "{{ perimeterd_config.crowdsec.api_key_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Atomically write the registered CrowdSec bouncer key
      ansible.builtin.copy:
        dest: "{{ perimeterd_config.crowdsec.api_key_file }}"
        content: "{{ perimeterd_crowdsec_api_key }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      diff: false

    - name: Derive the managed CrowdSec credential content identity
      ansible.builtin.set_fact:
        _perimeterd_crowdsec_credential_sha256: "{{ perimeterd_crowdsec_api_key | hash('sha256') }}"
      no_log: true
