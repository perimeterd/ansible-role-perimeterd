---
- name: Resolve the shared Fedora daemon release on the controller
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _perimeterd_package_format: rpm
    _perimeterd_architecture: arm64
    perimeterd_version: latest-prerelease
    perimeterd_github_token: "{{ lookup('ansible.builtin.env', 'PERIMETERD_TEST_GITHUB_TOKEN') }}"
  tasks:
    - name: Require an explicit release output path before contacting GitHub
      ansible.builtin.assert:
        that:
          - vm_release_output is defined
          - vm_release_output is string
          - vm_release_output | trim | length > 0
        fail_msg: Supply a nonempty vm_release_output path for the selected public tag.

    - name: Select the release and validate the Fedora package assets
      ansible.builtin.include_role:
        name: perimeterd
        tasks_from: resolve

    - name: Write only the selected public tag as machine-readable JSON
      ansible.builtin.copy:
        dest: "{{ vm_release_output }}"
        content: "{{ {'tag': _perimeterd_selected_tag} | to_json }}\n"
        mode: "0600"
