---
argument_specs:
  main:
    short_description: Block unwanted traffic at your Linux perimeter
    options:
      perimeterd_version:
        type: str
        default: latest
        description: Latest stable, latest-prerelease, or an exact published SemVer tag.
      perimeterd_allow_downgrade:
        type: bool
        default: false
        description: Permit an older selected native package version.
      perimeterd_config:
        type: dict
        description: Complete daemon configuration mapping; no implicit merge.
      perimeterd_service_enabled:
        type: bool
        default: true
        description: Enable perimeterd.service at boot.
      perimeterd_service_state:
        type: str
        choices: [started, stopped]
        default: started
        description: Desired runtime service state.
      perimeterd_config_show_diff:
        type: bool
        default: false
        description: Expose potentially secret configuration diffs.
      perimeterd_github_token:
        type: str
        default: ''
        no_log: true
        description: Optional controller-side GitHub API read token.
      perimeterd_download_timeout:
        type: int
        default: 60
        description: Positive HTTP request timeout in seconds.
